<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
        <link rel="alternate" type="application/rss+xml" href="$root$/rss.xml">
$for(css)$
        <link rel="stylesheet" href="$css$">
$endfor$
$if(highlighting-css)$
        <style>
$highlighting-css$
        </style>
$endif$
$if(math)$
        $math$
$endif$
$for(header-includes)$
        $header-includes$
$endfor$

        <meta name="description" content="$if(summary)$$summary$$else$$title$$endif$">
        <title>$title$</title>
    </head>
    <body>
        <div class="documentwrapper" itemscope itemtype="https://schema.org/BlogPosting">
        <p class="index">
            <a href="/">Home</a>
            | <a href="/categories.html">Posts by Category</a>
        </p>
$if(date)$
        <p class="date"><time itemprop="datePublished">$date$</time></p>
$endif$

        <article itemprop="articleBody">
            $body$
        </article>
$if(toc)$
        <nav id="$idprefix$TOC" role="doc-toc">
            $table-of-contents$
        </nav>
$endif$
        </div>
    </body>
</html>
